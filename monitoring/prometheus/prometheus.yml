global:
  scrape_interval: 15s # Frequência de recolha

scrape_configs:
  - job_name: 'angolapay-gateway'
    # Em dev local, usamos host.docker.internal para atingir a porta do host
    # Em K8s, isto seria substituído por service discovery (kubernetes_sd_configs)
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000'] 
        labels:
          application: 'angolapay-gateway'
          environment: 'development'